<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <title>Symphony of Decay: Planck Edition</title>
        <link rel="stylesheet" href="style.css" />
        <script src="https://cdn.jsdelivr.net/npm/planck-js/dist/planck.min.js"></script>
    </head>
    <body>
        <canvas id="bg-canvas"></canvas>
        <canvas id="game-canvas"></canvas>

        <button id="toolbox-toggle" onclick="toggleToolbox(event)">⚙️ Menu</button>

        <div id="ui">
            <h1>Symphony of Decay</h1>
            <p id="instruction-mode" data-i18n="inst-default">Drag to move. Click on empty space to spawn.</p>
            <div id="score-box">
                <span data-i18n="harmony">Harmony</span>: <span id="score" style="color: #2ed573">0</span>
            </div>
            <div id="body-count-box">
                <span data-i18n="objects">Objects</span>: <span id="body-count">0</span> /
                <span id="body-count-max">150</span>
            </div>
            <div id="dynamic-limit-box" style="pointer-events: auto; margin-top: 4px; display: flex; align-items: center; gap: 6px">
                <input type="checkbox" id="chk-dynamic-limit" checked onchange="setDynamicLimitEnabled(this.checked)" />
                <label for="chk-dynamic-limit" style="font-size: 11px; margin: 0; cursor: pointer" data-i18n="dynamic-limit-label"
                    >⚙️ Adaptive Limit</label
                >
            </div>
        </div>

        <div id="toolbox" class="collapsed">
            <!-- Language Selector Flags -->
            <div
                class="tool-group"
                style="
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    background: rgba(0, 0, 0, 0.1);
                    padding: 8px;
                    border-radius: 6px;
                ">
                <label style="margin: 0" data-i18n="language">Language:</label>
                <div>
                    <button
                        class="sub-btn"
                        onclick="setLanguage('en')"
                        style="padding: 4px 8px; font-size: 16px; cursor: pointer">
                        🇬🇧
                    </button>
                    <button
                        class="sub-btn"
                        onclick="setLanguage('it')"
                        style="padding: 4px 8px; font-size: 16px; cursor: pointer">
                        🇮🇹
                    </button>
                </div>
            </div>

            <div class="menu-controls">
                <button class="action-btn" onclick="clearSceneAction()" data-i18n="btn-clear">🧹 Clear</button>
                <button class="action-btn" id="btn-pause-play" onclick="togglePause()" data-i18n="btn-pause">
                    ⏸️ Pause
                </button>
                <button class="action-btn primary" onclick="triggerDecay()" data-i18n="btn-glitch">⚡ GLITCH</button>
            </div>

            <div class="menu-controls">
                <button class="sub-btn" id="btn-undo" onclick="undoAction()" data-i18n="btn-undo">↩️ Undo</button>
                <button class="sub-btn" id="btn-redo" onclick="redoAction()" data-i18n="btn-redo">↪️ Redo</button>
            </div>

            <div class="tool-group">
                <label>
                    <span data-i18n="select-object">Select Object</span>:
                    <button class="sub-btn" id="theme-toggle" onclick="toggleTheme()" data-i18n="btn-theme">
                        🌓 Theme
                    </button>
                </label>
                <div class="block-selector">
                    <button class="block-btn active" id="btn-bass" onclick="selectBlock('bass')">Orolite</button>
                    <button class="block-btn" id="btn-wood" onclick="selectBlock('wood')">Pentacore</button>
                    <button class="block-btn" id="btn-mid" onclick="selectBlock('mid')">Hexarun</button>
                    <button class="block-btn" id="btn-rubber" onclick="selectBlock('rubber')">Septifor</button>
                    <button class="block-btn" id="btn-high" onclick="selectBlock('high')">Octavox</button>
                    <button class="block-btn" id="btn-neon" onclick="selectBlock('neon')">Astral</button>
                    <button class="block-btn" id="btn-wall" onclick="selectBlock('wall')" data-i18n="block-wall">
                        Wall
                    </button>
                    <button class="block-btn note-btn" id="btn-note_do" onclick="selectBlock('note_do')">🔴 Do</button>
                    <button class="block-btn note-btn" id="btn-note_re" onclick="selectBlock('note_re')">🟠 Re</button>
                    <button class="block-btn note-btn" id="btn-note_mi" onclick="selectBlock('note_mi')">🟡 Mi</button>
                    <button class="block-btn note-btn" id="btn-note_fa" onclick="selectBlock('note_fa')">🟢 Fa</button>
                    <button class="block-btn note-btn" id="btn-note_sol" onclick="selectBlock('note_sol')">🔵 Sol</button>
                    <button class="block-btn note-btn" id="btn-note_la" onclick="selectBlock('note_la')">🟣 La</button>
                    <button class="block-btn note-btn" id="btn-note_si" onclick="selectBlock('note_si')">🟪 Si</button>
                    <button class="block-btn" id="btn-emitter" onclick="selectBlock('emitter')" data-i18n="block-emitter">
                        🎯 Emitter
                    </button>
                </div>
            </div>

            <div class="tool-group">
                <label data-i18n="timbre-label">Timbre / Sound Type:</label>
                <select id="timbre-select" class="scene-select" onchange="setTimbreMode(this.value)"></select>
            </div>

            <div class="tool-group">
                <label data-i18n="scale-label">Musical Scale:</label>
                <select id="scale-select" class="scene-select" onchange="changeScale(this.value)"></select>
            </div>

            <div class="tool-group">
                <label data-i18n="interactive-tools">Interactive Tools:</label>
                <div class="special-tools">
                    <button class="special-btn" id="btn-rope" onclick="setMode('rope')" data-i18n="tool-rope">
                        🧵 Rope
                    </button>
                    <button class="special-btn" id="btn-chain" onclick="setMode('chain')" data-i18n="tool-chain">
                        ⛓️ Rigid Chain
                    </button>
                    <button class="special-btn" id="btn-bar" onclick="setMode('bar')" data-i18n="tool-bar">
                        🔗 Bar
                    </button>
                    <button class="special-btn" id="btn-eraser" onclick="setMode('eraser')" data-i18n="tool-eraser">
                        🧹 Eraser
                    </button>
                </div>
            </div>

            <div class="tool-group">
                <label
                    ><span data-i18n="bg-trees">Background Trees Count</span>:
                    <span id="val-trees-count" class="slider-val">12</span></label
                >
                <input
                    type="number"
                    id="input-trees-count"
                    min="1"
                    max="300"
                    value="30"
                    onchange="updateTreesCount()" />
            </div>

            <div class="tool-group" style="background: rgba(255, 0, 85, 0.05); padding: 6px; border-radius: 6px">
                <label
                    ><span data-i18n="rope-segments">Rope/Chain Segments</span>:
                    <span id="val-rope-seg" class="slider-val">12</span></label
                >
                <input
                    type="range"
                    id="slider-rope-seg"
                    min="3"
                    max="30"
                    step="1"
                    value="12"
                    oninput="updateRopeProps()" />
            </div>

            <div class="tool-group">
                <label><span data-i18n="gravity-label">Physics - Gravity Y</span>: <span id="val-gravity" class="slider-val">9.8</span></label>
                <input
                    type="range"
                    id="slider-gravity"
                    min="0"
                    max="25"
                    step="0.5"
                    value="9.8"
                    oninput="updatePhysics()" />
            </div>

            <div class="tool-group">
                <label
                    ><span data-i18n="air-drag">Physics - Air Drag</span>:
                    <span id="val-drag" class="slider-val">0.02</span></label
                >
                <input
                    type="range"
                    id="slider-drag"
                    min="0"
                    max="0.1"
                    step="0.001"
                    value="0.02"
                    oninput="updatePhysics()" />
            </div>

            <div class="tool-group">
                <label
                    ><span data-i18n="wind-speed">Wind - Speed</span>:
                    <span id="val-wind" class="slider-val">0.0</span></label
                >
                <input
                    type="range"
                    id="slider-wind"
                    min="-5.0"
                    max="20"
                    step="0.2"
                    value="0.0"
                    oninput="updatePhysics()" />
            </div>

            <div class="tool-group">
                <label
                    ><span data-i18n="wind-turb">Wind - Turbulence</span>:
                    <span id="val-turbulence" class="slider-val">0.0</span></label
                >
                <input
                    type="range"
                    id="slider-turbulence"
                    min="0"
                    max="20.0"
                    step="0.2"
                    value="0.0"
                    oninput="updatePhysics()" />
            </div>

            <button class="sub-btn" onclick="resetPhysics()" data-i18n="reset-physics">↩️ Reset Physics</button>

            <div class="tool-group">
                <label
                    ><span data-i18n="reverb-label">Audio - Reverb</span>:
                    <span id="val-reverb" class="slider-val">0.15</span></label
                >
                <input
                    type="range"
                    id="slider-reverb"
                    min="0"
                    max="1"
                    step="0.01"
                    value="0.15"
                    oninput="updateEffects()" />
            </div>

            <div class="tool-group">
                <label
                    ><span data-i18n="delay-label">Audio - Delay</span>:
                    <span id="val-delay" class="slider-val">0.12</span></label
                >
                <input
                    type="range"
                    id="slider-delay"
                    min="0"
                    max="1"
                    step="0.01"
                    value="0.12"
                    oninput="updateEffects()" />
            </div>

            <div class="tool-group" style="display: flex; justify-content: space-between; align-items: center">
                <label style="margin: 0" data-i18n="quantize-label">Rhythmic Quantization</label>
                <input type="checkbox" id="chk-quantize" onchange="setQuantizeEnabled(this.checked)" />
            </div>

            <div class="tool-group">
                <label
                    ><span data-i18n="bpm-label">Quantize - BPM</span>:
                    <span id="val-bpm" class="slider-val">120</span></label
                >
                <input
                    type="range"
                    id="slider-bpm"
                    min="60"
                    max="200"
                    step="1"
                    value="120"
                    oninput="setQuantizeBpm(this.value)" />
            </div>

            <div class="tool-group" style="display: flex; justify-content: space-between; align-items: center">
                <label style="margin: 0" data-i18n="trail-label">Visual - Motion Trail</label>
                <input type="checkbox" id="chk-trail" onchange="setTrailEnabled(this.checked)" />
            </div>

            <div class="tool-group" style="margin-top: 4px">
                <label data-i18n="saved-scenes">Saved Scenes:</label>
                <select id="scene-select" class="scene-select"></select>
                <div class="menu-controls">
                    <button class="action-btn" onclick="saveScene()" data-i18n="btn-save">💾 Save</button>
                    <button class="action-btn" onclick="loadScene()" data-i18n="btn-load">📂 Load</button>
                </div>
                <button
                    class="sub-btn"
                    onclick="deleteScene()"
                    style="width: 100%; margin-top: 4px"
                    data-i18n="btn-delete">
                    🗑️ Delete Selected
                </button>
            </div>

            <div class="tool-group" style="margin-top: 4px">
                <label
                    ><span data-i18n="volume-mixer">Volume Mixer</span>:
                    <button class="sub-btn" onclick="resetMixer()" data-i18n="btn-reset">Reset</button></label
                >
                <div class="mixer-item" style="margin-bottom: 6px">
                    <label data-i18n="master-vol">Master Volume</label>
                    <input
                        type="range"
                        id="vol-master"
                        min="0"
                        max="1"
                        step="0.05"
                        value="0.8"
                        oninput="updateMasterVolume(this.value)" />
                </div>
                <div class="mixer-grid">
                    <div class="mixer-item">
                        <label>Orolite</label><input
                            type="range"
                            id="vol-bass"
                            min="0"
                            max="1"
                            step="0.1"
                            value="0.8"
                            oninput="updateVolume('bass', this.value)" />
                    </div>
                    <div class="mixer-item">
                        <label>Pentacore</label><input
                            type="range"
                            id="vol-wood"
                            min="0"
                            max="1"
                            step="0.1"
                            value="0.8"
                            oninput="updateVolume('wood', this.value)" />
                    </div>
                    <div class="mixer-item">
                        <label>Hexarun</label><input
                            type="range"
                            id="vol-mid"
                            min="0"
                            max="1"
                            step="0.1"
                            value="0.8"
                            oninput="updateVolume('mid', this.value)" />
                    </div>
                    <div class="mixer-item">
                        <label>Septifor</label><input
                            type="range"
                            id="vol-rubber"
                            min="0"
                            max="1"
                            step="0.1"
                            value="0.8"
                            oninput="updateVolume('rubber', this.value)" />
                    </div>
                    <div class="mixer-item">
                        <label>Octavox</label><input
                            type="range"
                            id="vol-high"
                            min="0"
                            max="1"
                            step="0.1"
                            value="0.8"
                            oninput="updateVolume('high', this.value)" />
                    </div>
                    <div class="mixer-item">
                        <label>Astral</label
                        ><input
                            type="range"
                            id="vol-neon"
                            min="0"
                            max="1"
                            step="0.1"
                            value="0.8"
                            oninput="updateVolume('neon', this.value)" />
                    </div>
                    <div class="mixer-item">
                        <label data-i18n="block-wall">Wall</label><input
                            type="range"
                            id="vol-wall"
                            min="0"
                            max="1"
                            step="0.1"
                            value="0.8"
                            oninput="updateVolume('wall', this.value)" />
                    </div>
                </div>
            </div>
        </div>

        <div id="emitter-panel" style="display: none">
            <div class="emitter-panel-header">
                <span data-i18n="emitter-panel-title">🎯 Emitter Settings</span>
                <button class="sub-btn" onclick="closeEmitterPanel()" data-i18n="emitter-panel-close">✕ Close</button>
            </div>
            <button class="sub-btn" id="btn-emitter-pause" onclick="toggleEmitterPaused()" style="width: 100%">
                ⏸️ Pause
            </button>
            <div class="tool-group">
                <label data-i18n="emitter-object-label">Fires:</label>
                <select id="emitter-object-select" class="scene-select" onchange="setEmitterObjectType(this.value)"></select>
            </div>
            <div class="tool-group">
                <label data-i18n="emitter-pattern-label">🎵 Melodic Pattern</label>
                <div id="emitter-pattern-steps" class="pattern-steps"></div>
                <div class="pattern-add-row">
                    <select id="emitter-pattern-add-select" class="scene-select" style="margin-bottom: 0"></select>
                    <button class="sub-btn" onclick="addPatternStep()" data-i18n="emitter-pattern-add-btn">+ Add</button>
                </div>
                <button class="sub-btn" onclick="clearEmitterPattern()" data-i18n="emitter-pattern-clear-btn">🗑️ Clear Pattern</button>
            </div>
            <div class="tool-group">
                <label
                    ><span data-i18n="emitter-power-label">Launch Power</span>:
                    <span id="val-emitter-power" class="slider-val">12</span></label
                >
                <input
                    type="range"
                    id="slider-emitter-power"
                    min="2"
                    max="40"
                    step="1"
                    value="12"
                    oninput="setEmitterPower(this.value)" />
            </div>
            <div class="tool-group" id="emitter-bpm-row">
                <label
                    ><span data-i18n="emitter-bpm-label">Fire Rate (BPM)</span>:
                    <span id="val-emitter-bpm" class="slider-val">90</span></label
                >
                <input
                    type="range"
                    id="slider-emitter-bpm"
                    min="20"
                    max="300"
                    step="1"
                    value="90"
                    oninput="setEmitterBpm(this.value)" />
            </div>
            <div class="tool-group emitter-sync-group">
                <label style="flex-direction: row; align-items: center; gap: 6px; justify-content: flex-start">
                    <input type="checkbox" id="chk-emitter-sync" onchange="setEmitterSyncEnabled(this.checked)" />
                    <span data-i18n="emitter-sync-label">🎼 Sync to Global Clock</span>
                </label>
                <div id="emitter-sync-division-row" style="margin-top: 4px">
                    <label data-i18n="emitter-sync-division-label" style="margin-bottom: 3px">Note Division</label>
                    <select
                        id="emitter-sync-division-select"
                        class="scene-select"
                        style="margin-bottom: 0"
                        onchange="setEmitterSyncDivision(this.value)"></select>
                </div>
                <div style="margin-top: 6px">
                    <label
                        ><span data-i18n="global-clock-bpm-label">Global Clock BPM</span>:
                        <span id="val-global-clock-bpm" class="slider-val">120</span></label
                    >
                    <input
                        type="range"
                        id="slider-global-clock-bpm"
                        min="40"
                        max="240"
                        step="1"
                        value="120"
                        oninput="setGlobalClockBpm(this.value)" />
                </div>
                <button class="sub-btn" style="margin-top: 4px; width: 100%" onclick="resetGlobalClock()" data-i18n="global-clock-reset-btn">
                    ↺ Reset Clock Phase
                </button>
            </div>
            <div class="tool-group">
                <label
                    ><span data-i18n="emitter-lifetime-label">Lifetime (s)</span>:
                    <span id="val-emitter-lifetime" class="slider-val">8</span></label
                >
                <input
                    type="range"
                    id="slider-emitter-lifetime"
                    min="0"
                    max="30"
                    step="1"
                    value="8"
                    oninput="setEmitterLifetime(this.value)" />
            </div>
        </div>

        <script src="languages.js"></script>
        <script src="audio.js"></script>
        <script src="physics-world.js"></script>
        <script src="objects.js"></script>
        <script src="scenes.js"></script>
        <script src="background.js"></script>
        <script src="main.js"></script>
    </body>
</html>
