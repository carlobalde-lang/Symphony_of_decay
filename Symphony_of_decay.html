<!doctype html>
<html lang="it">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <title>Symphony of Decay: Planck Edition</title>
        <style>
            :root {
                --bg-color: #05050a;
                --text-color: #eee;
                --ui-bg: rgba(10, 10, 20, 0.85);
                --toolbox-bg: rgba(15, 15, 25, 0.95);
                --border-color: #444;
                --primary-border: #ff0055;
                --btn-bg: #222;
                --btn-hover: #444;
                --sub-btn-bg: #2a2a3d;
                --wall-color: #1a1a2e;
            }

            body.light-theme {
                --bg-color: #f0f2f5;
                --text-color: #222;
                --ui-bg: rgba(255, 255, 255, 0.9);
                --toolbox-bg: rgba(240, 242, 245, 0.95);
                --border-color: #ccc;
                --primary-border: #ff0055;
                --btn-bg: #e4e6eb;
                --btn-hover: #d8dadf;
                --sub-btn-bg: #d0d3d9;
                --wall-color: #d1d5db;
            }

            body {
                margin: 0;
                padding: 0;
                background: var(--bg-color);
                color: var(--text-color);
                font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
                touch-action: none;
                transition:
                    background 0.3s,
                    color 0.3s;
            }
            #game-canvas {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 1;
            }

            #bg-canvas {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 0;
                pointer-events: none;
            }

            #ui {
                position: absolute;
                top: 10px;
                left: 10px;
                background: var(--ui-bg);
                padding: 12px 16px;
                border-radius: 10px;
                border: 1px solid var(--primary-border);
                pointer-events: none;
                backdrop-filter: blur(8px);
                max-width: 280px;
                box-shadow: 0 0 20px rgba(255, 0, 85, 0.2);
                z-index: 10;
            }
            h1 {
                margin: 0 0 6px 0;
                font-size: 16px;
                color: #ff0055;
                text-transform: uppercase;
                letter-spacing: 1px;
                font-weight: 700;
            }
            p {
                margin: 0 0 6px 0;
                font-size: 12px;
                line-height: 1.3;
                color: var(--text-color);
                opacity: 0.9;
            }
            #score-box {
                margin-top: 6px;
                font-weight: bold;
                color: var(--text-color);
                font-size: 14px;
            }

            #toolbox-toggle {
                display: none;
                position: absolute;
                top: 10px;
                right: 10px;
                background: var(--ui-bg);
                color: var(--text-color);
                border: 1px solid var(--primary-border);
                padding: 10px 14px;
                border-radius: 10px;
                font-family: inherit;
                font-weight: bold;
                font-size: 13px;
                cursor: pointer;
                z-index: 20;
                backdrop-filter: blur(8px);
            }

            #toolbox {
                position: absolute;
                top: 10px;
                right: 10px;
                background: var(--toolbox-bg);
                padding: 12px;
                border-radius: 12px;
                border: 1px solid var(--border-color);
                display: flex;
                flex-direction: column;
                gap: 8px;
                backdrop-filter: blur(8px);
                z-index: 15;
                width: 280px;
                max-height: calc(100vh - 30px);
                overflow-y: auto;
                transition:
                    transform 0.3s ease,
                    opacity 0.3s ease;
            }

            .tool-group {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }
            .tool-group label {
                font-size: 11px;
                font-weight: 600;
                color: var(--text-color);
                opacity: 0.85;
                text-transform: uppercase;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .block-selector {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 5px;
            }
            .block-btn {
                background: var(--btn-bg);
                border: 2px solid var(--border-color);
                color: var(--text-color);
                padding: 8px 4px;
                font-size: 11px;
                font-family: inherit;
                cursor: pointer;
                border-radius: 5px;
                text-align: center;
                transition: 0.2s;
                font-weight: 600;
            }
            .block-btn.active {
                border-color: #ff0055;
                background: #331122;
                font-weight: bold;
                color: #fff;
            }
            .block-btn#btn-bass {
                border-left: 3px solid #ff6b81;
            }
            .block-btn#btn-wood {
                border-left: 3px solid #e67e22;
            }
            .block-btn#btn-mid {
                border-left: 3px solid #70a1ff;
            }
            .block-btn#btn-rubber {
                border-left: 3px solid #ffa502;
            }
            .block-btn#btn-high {
                border-left: 3px solid #2ed573;
            }
            .block-btn#btn-neon {
                border-left: 3px solid #ff00ff;
            }
            .block-btn#btn-poleH,
            .block-btn#btn-poleV {
                border-left: 3px solid #a4b0be;
            }

            .special-tools {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 5px;
                margin-top: 2px;
            }
            .special-btn {
                background: var(--btn-bg);
                border: 2px solid var(--border-color);
                color: var(--text-color);
                padding: 8px 6px;
                font-size: 11px;
                font-family: inherit;
                cursor: pointer;
                border-radius: 6px;
                text-align: center;
                transition: 0.2s;
                font-weight: 600;
            }
            .special-btn.active {
                border-color: #ffa502;
                background: #443311;
                color: #ffa502;
            }
            .special-btn#btn-eraser.active {
                border-color: #ff4757;
                background: #441111;
                color: #ff4757;
            }

            input[type="range"],
            input[type="number"] {
                width: 100%;
                accent-color: #ff0055;
                cursor: pointer;
            }
            input[type="number"] {
                background: var(--btn-bg);
                border: 1px solid var(--border-color);
                color: var(--text-color);
                padding: 4px;
                border-radius: 4px;
                font-family: inherit;
            }
            .slider-val {
                color: #ff0055;
                font-weight: bold;
            }
            .mixer-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 6px;
            }
            .mixer-item {
                background: rgba(128, 128, 128, 0.1);
                padding: 6px 8px;
                border-radius: 4px;
            }
            .mixer-item label {
                font-size: 10px;
            }

            .sub-btn {
                background: var(--sub-btn-bg);
                border: 1px solid var(--border-color);
                color: var(--text-color);
                font-size: 11px;
                padding: 5px 10px;
                border-radius: 4px;
                cursor: pointer;
                font-family: inherit;
                font-weight: 600;
                transition: 0.2s;
            }
            .sub-btn:hover {
                opacity: 0.8;
            }

            .menu-controls {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 6px;
                margin-bottom: 4px;
            }
            button.action-btn {
                background: var(--btn-bg);
                color: var(--text-color);
                border: 1px solid var(--border-color);
                padding: 10px 10px;
                font-family: inherit;
                cursor: pointer;
                transition: 0.2s;
                border-radius: 8px;
                font-weight: bold;
                font-size: 11px;
                text-align: center;
            }
            button.action-btn:hover {
                background: var(--btn-hover);
                border-color: #888;
            }
            button.primary {
                background: #ff0055;
                color: #fff;
                border-color: #ff0055;
                box-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
                grid-column: span 2;
            }
            button.primary:hover {
                background: #ff3366;
            }

            button.action-btn#btn-pause-play {
                background: linear-gradient(135deg, #3b82f6, #1d4ed8);
                color: #ffffff;
                border: 1px solid #60a5fa;
                padding: 10px 12px;
                font-size: 12px;
                border-radius: 8px;
                box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
                transition: all 0.2s ease;
            }
            button.action-btn#btn-pause-play:hover {
                background: linear-gradient(135deg, #60a5fa, #2563eb);
                border-color: #93c5fd;
                box-shadow: 0 0 15px rgba(59, 130, 246, 0.7);
                transform: scale(1.02);
            }

            @media (max-width: 768px) {
                #toolbox-toggle {
                    display: block;
                }
                #toolbox.collapsed {
                    transform: translateX(110%);
                    opacity: 0;
                    pointer-events: none;
                }
                #toolbox {
                    top: 55px;
                    right: 10px;
                    width: calc(100vw - 40px);
                    max-width: 320px;
                }
                #ui {
                    max-width: 200px;
                    padding: 10px;
                }
                h1 {
                    font-size: 14px;
                }
                p {
                    font-size: 11px;
                }
            }
        </style>
    </head>
    <body>
        <canvas id="bg-canvas"></canvas>
        <canvas id="game-canvas"></canvas>

        <button id="toolbox-toggle" onclick="toggleToolbox(event)">⚙️ Menu</button>

        <div id="ui">
            <h1>Symphony of Decay</h1>
            <p id="instruction-mode">Trascina per muovere. Clicca a vuoto per spawnare.</p>
            <div id="score-box">Armonia: <span id="score" style="color: #2ed573">0</span></div>
        </div>

        <div id="toolbox" class="collapsed">
            <div class="menu-controls">
                <button class="action-btn" onclick="clearScene()">🧹 Pulisci</button>
                <button class="action-btn" id="btn-pause-play" onclick="togglePause()">⏸️ Pausa</button>
                <button class="action-btn primary" onclick="triggerDecay()">⚡ GLITCH</button>
            </div>

            <div class="tool-group">
                <label
                    >Seleziona Oggetto:
                    <button class="sub-btn" id="theme-toggle" onclick="toggleTheme()">🌓 Tema</button>
                </label>
                <div class="block-selector">
                    <button class="block-btn active" id="btn-bass" onclick="selectBlock('bass')">Orolite</button>
                    <button class="block-btn" id="btn-wood" onclick="selectBlock('wood')">Pentacore</button>
                    <button class="block-btn" id="btn-mid" onclick="selectBlock('mid')">Hexarun</button>
                    <button class="block-btn" id="btn-rubber" onclick="selectBlock('rubber')">Septifor</button>
                    <button class="block-btn" id="btn-high" onclick="selectBlock('high')">Octavox</button>
                    <button class="block-btn" id="btn-neon" onclick="selectBlock('neon')">Astral</button>
                    <button class="block-btn" id="btn-poleH" onclick="selectBlock('poleH')">Palo Oriz.</button>
                    <button class="block-btn" id="btn-poleV" onclick="selectBlock('poleV')">Palo Vert.</button>
                </div>
            </div>

            <div class="tool-group">
                <label>Strumenti Interattivi:</label>
                <div class="special-tools">
                    <button class="special-btn" id="btn-rope" onclick="setMode('rope')">🧵 Corda</button>
                    <button class="special-btn" id="btn-chain" onclick="setMode('chain')">⛓️ Catena Rigida</button>
                    <button class="special-btn" id="btn-bar" onclick="setMode('bar')">🔗 Barra</button>
                    <button class="special-btn" id="btn-eraser" onclick="setMode('eraser')">🧹 Gomma</button>
                </div>
            </div>

            <!-- Nuovo campo per decidere il numero di alberi -->
            <div class="tool-group">
                <label>Numero Alberi Sfondo: <span id="val-trees-count" class="slider-val">12</span></label>
                <input
                    type="number"
                    id="input-trees-count"
                    min="1"
                    max="300"
                    value="30"
                    onchange="updateTreesCount()" />
            </div>

            <div class="tool-group" style="background: rgba(255, 0, 85, 0.05); padding: 6px; border-radius: 6px">
                <label>Corda/Catena - Segmenti: <span id="val-rope-seg" class="slider-val">12</span></label>
                <input
                    type="range"
                    id="slider-rope-seg"
                    min="3"
                    max="30"
                    step="1"
                    value="12"
                    oninput="updateRopeProps()" />
                <label style="margin-top: 4px"
                    >Corda/Catena - Rigidità: <span id="val-rope-stiff" class="slider-val">1.0</span></label
                >
                <input
                    type="range"
                    id="slider-rope-stiff"
                    min="0.1"
                    max="1.0"
                    step="0.05"
                    value="1.0"
                    oninput="updateRopeProps()" />
            </div>

            <div class="tool-group">
                <label>Fisica - Gravità Y: <span id="val-gravity" class="slider-val">20.0</span></label>
                <input
                    type="range"
                    id="slider-gravity"
                    min="0"
                    max="40"
                    step="0.5"
                    value="20.0"
                    oninput="updatePhysics()" />
            </div>

            <div class="tool-group">
                <label>Fisica - Attrito Aria: <span id="val-drag" class="slider-val">0.001</span></label>
                <input
                    type="range"
                    id="slider-drag"
                    min="0"
                    max="0.02"
                    step="0.001"
                    value="0.001"
                    oninput="updatePhysics()" />
            </div>

            <div class="tool-group">
                <label>Vento - Velocità: <span id="val-wind" class="slider-val">0.0</span></label>
                <input
                    type="range"
                    id="slider-wind"
                    min="-5.0"
                    max="5.0"
                    step="0.2"
                    value="0.0"
                    oninput="updatePhysics()" />
            </div>

            <div class="tool-group">
                <label>Vento - Irregolarità: <span id="val-turbulence" class="slider-val">0.0</span></label>
                <input
                    type="range"
                    id="slider-turbulence"
                    min="0"
                    max="4.0"
                    step="0.2"
                    value="0.0"
                    oninput="updatePhysics()" />
            </div>

            <button class="sub-btn" onclick="resetPhysics()">↩️ Reset Fisica</button>

            <div class="tool-group" style="margin-top: 4px">
                <label>Mixer Volumi: <button class="sub-btn" onclick="resetMixer()">Reset</button></label>
                <div class="mixer-item" style="margin-bottom: 6px">
                    <label>Master Generale</label>
                    <input
                        type="range"
                        id="vol-master"
                        min="0"
                        max="1"
                        step="0.05"
                        value="0.8"
                        oninput="updateMasterVolume(this.value)" />
                </div>
                <div class="mixer-grid">
                    <div class="mixer-item">
                        <label>Orolite</label
                        ><input
                            type="range"
                            id="vol-bass"
                            min="0"
                            max="1"
                            step="0.1"
                            value="0.8"
                            oninput="updateVolume('bass', this.value)" />
                    </div>
                    <div class="mixer-item">
                        <label>Pentacore</label
                        ><input
                            type="range"
                            id="vol-wood"
                            min="0"
                            max="1"
                            step="0.1"
                            value="0.8"
                            oninput="updateVolume('wood', this.value)" />
                    </div>
                    <div class="mixer-item">
                        <label>Hexarun</label
                        ><input
                            type="range"
                            id="vol-mid"
                            min="0"
                            max="1"
                            step="0.1"
                            value="0.8"
                            oninput="updateVolume('mid', this.value)" />
                    </div>
                    <div class="mixer-item">
                        <label>Septifor</label
                        ><input
                            type="range"
                            id="vol-rubber"
                            min="0"
                            max="1"
                            step="0.1"
                            value="0.8"
                            oninput="updateVolume('rubber', this.value)" />
                    </div>
                    <div class="mixer-item">
                        <label>Octavox</label
                        ><input
                            type="range"
                            id="vol-high"
                            min="0"
                            max="1"
                            step="0.1"
                            value="0.8"
                            oninput="updateVolume('high', this.value)" />
                    </div>
                    <div class="mixer-item">
                        <label>Astral</label
                        ><input
                            type="range"
                            id="vol-neon"
                            min="0"
                            max="1"
                            step="0.1"
                            value="0.8"
                            oninput="updateVolume('neon', this.value)" />
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/planck-js/dist/planck.min.js"></script>

        <script>
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            const PI = Math.PI;
            const PHI = (1 + Math.sqrt(5)) / 2;

            const baseRoot = 110.0;
            const scales = {
                bass: [baseRoot, baseRoot * 1.5, baseRoot * 2],
                wood: [baseRoot * 1.25, baseRoot * 1.5, baseRoot * 2],
                mid: [baseRoot * 2, baseRoot * 2.5, baseRoot * 3, baseRoot * 4],
                rubber: [baseRoot * 3, baseRoot * 3.75, baseRoot * 4.5],
                high: [baseRoot * 4, baseRoot * 5, baseRoot * 6, baseRoot * 8],
                neon: [baseRoot * 5, baseRoot * 6, baseRoot * 7.5, baseRoot * 10],
                pole: [baseRoot * 1.5, baseRoot * 2.5]
            };

            const volumes = { bass: 0.8, wood: 0.8, mid: 0.8, rubber: 0.8, high: 0.8, neon: 0.8, pole: 0.8 };
            let masterVolume = 0.8;

            function updateVolume(type, val) {
                volumes[type] = parseFloat(val);
            }
            function updateMasterVolume(val) {
                masterVolume = parseFloat(val);
            }
            function resetMixer() {
                masterVolume = 0.8;
                document.getElementById("vol-master").value = 0.8;
                for (let key in volumes) {
                    volumes[key] = 0.8;
                    const slider = document.getElementById("vol-" + key);
                    if (slider) slider.value = 0.8;
                }
            }

            let activeSoundsCount = 0;
            const MAX_SIMULTANEOUS_SOUNDS = 12;

            function playMixedSound(typeA, typeB, velocity) {
                if (audioCtx.state === "suspended") audioCtx.resume();
                if (activeSoundsCount >= MAX_SIMULTANEOUS_SOUNDS) return;
                activeSoundsCount++;

                const now = audioCtx.currentTime;
                const primaryType = typeA;
                const secondaryType = typeB && typeB !== typeA ? typeB : null;

                const scale1 = scales[primaryType] || scales.pole;
                const freq1 = scale1[Math.floor(Math.random() * scale1.length)];

                const osc1 = audioCtx.createOscillator();
                const oscSub = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                const filter1 = audioCtx.createBiquadFilter();

                osc1.type = "sine";
                osc1.frequency.setValueAtTime(freq1, now);
                oscSub.type = "sine";
                oscSub.frequency.setValueAtTime(freq1 * 0.5, now);

                filter1.type = "lowpass";
                filter1.frequency.setValueAtTime(Math.min(freq1 * 1.8, 1600), now);
                filter1.Q.setValueAtTime(0.5, now);

                const baseVol1 = volumes[primaryType] !== undefined ? volumes[primaryType] : 0.8;
                const vol1 = Math.min(0.25, velocity * 0.03) * baseVol1 * masterVolume;

                gain1.gain.setValueAtTime(0, now);
                gain1.gain.linearRampToValueAtTime(vol1, now + 0.12);
                gain1.gain.exponentialRampToValueAtTime(0.0001, now + 2.5);

                osc1.connect(filter1);
                oscSub.connect(filter1);
                filter1.connect(gain1);
                gain1.connect(audioCtx.destination);

                osc1.start(now);
                oscSub.start(now);
                osc1.stop(now + 2.6);
                oscSub.stop(now + 2.6);

                if (secondaryType) {
                    const scale2 = scales[secondaryType] || scales.pole;
                    const freq2 = scale2[Math.floor(Math.random() * scale2.length)];
                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    const filter2 = audioCtx.createBiquadFilter();

                    osc2.type = "sine";
                    osc2.frequency.setValueAtTime(freq2 / 2, now);
                    filter2.type = "lowpass";
                    filter2.frequency.setValueAtTime(1400, now);

                    const baseVol2 = volumes[secondaryType] !== undefined ? volumes[secondaryType] : 0.8;
                    const vol2 = vol1 * 0.35;

                    gain2.gain.setValueAtTime(0, now);
                    gain2.gain.linearRampToValueAtTime(vol2, now + 0.05);
                    gain2.gain.exponentialRampToValueAtTime(0.0001, now + 2.2);

                    osc2.connect(filter2);
                    filter2.connect(gain2);
                    gain2.connect(audioCtx.destination);

                    osc2.start(now);
                    osc2.stop(now + 2.3);
                }

                setTimeout(() => {
                    activeSoundsCount = Math.max(0, activeSoundsCount - 1);
                }, 300);
                addScore(vol1);
            }

            let totalHarmony = 0;
            const scoreEl = document.getElementById("score");
            function addScore(points) {
                totalHarmony += Math.round(points * 2000);
                scoreEl.innerText = totalHarmony;
            }
            function clearScore() {
                totalHarmony = 0;
                scoreEl.innerText = "0";
            }

            let currentChoice = "bass";
            let currentMode = "spawn";
            let linkStartBody = null;
            let linkStartPoint = null;
            let isPaused = false;
            let ropeIdCounter = 0;

            function toggleToolbox(event) {
                if (event) event.stopPropagation();
                document.getElementById("toolbox").classList.toggle("collapsed");
            }

            function updateRopeProps() {
                const segVal = document.getElementById("slider-rope-seg").value;
                const stiffVal = parseFloat(document.getElementById("slider-rope-stiff").value);
                document.getElementById("val-rope-seg").innerText = segVal;
                document.getElementById("val-rope-stiff").innerText = stiffVal;

                for (let j = world.getJointList(); j; j = j.getNext()) {
                    if (j.isRopeDistanceJoint && typeof j.setFrequency === "function") {
                        j.setFrequency(stiffVal * 15);
                    }
                }
            }

            function toggleTheme() {
                document.body.classList.toggle("light-theme");
            }

            function togglePause() {
                isPaused = !isPaused;
                const btn = document.getElementById("btn-pause-play");
                if (isPaused) {
                    btn.innerText = "▶️ Play";
                    document.getElementById("instruction-mode").innerText = "Simulazione in PAUSA.";
                } else {
                    btn.innerText = "⏸️ Pausa";
                    document.getElementById("instruction-mode").innerText = "Simulazione attiva.";
                }
            }

            function selectBlock(type) {
                if (currentMode === "spawn" && currentChoice === type) {
                    currentMode = "none";
                    document.querySelectorAll(".block-btn").forEach((btn) => btn.classList.remove("active"));
                    document.getElementById("instruction-mode").innerText =
                        "Modalità Libera: Trascina solo per muovere gli oggetti.";
                } else {
                    currentMode = "spawn";
                    currentChoice = type;
                    linkStartBody = null;
                    linkStartPoint = null;
                    document.querySelectorAll(".block-btn").forEach((btn) => btn.classList.remove("active"));
                    document.querySelectorAll(".special-btn").forEach((btn) => btn.classList.remove("active"));
                    document.getElementById("btn-" + type).classList.add("active");

                            const aA = j.getAnchorA();

                            if (aA && aB && distToSegment(mousePos, aA, aB) < 15) {
                                clickedJoint = j;

                    if (clickedJoint) {

                            const rId = clickedJoint.ropeId;
                            let b = world.getBodyList();
                            while (b) {
                                let nextB = b.getNext();
                                if (b.ropeId === rId) world.destroyBody(b);
                                b = nextB;
                            }
                            let j = world.getJointList();
                            while (j) {
                                let nextJ = j.getNext();
                                if (j.ropeId === rId) world.destroyJoint(j);
                                j = nextJ;
                            }
                        } else {
                            world.destroyJoint(clickedJoint);
                        }
                    } else if (clickedBody) {
                        if (clickedBody.ropeId !== undefined) {
                            const rId = clickedBody.ropeId;
                            let b = world.getBodyList();
                            while (b) {
                                let nextB = b.getNext();
                                if (b.ropeId === rId) world.destroyBody(b);
                                b = nextB;
                            }
                            let j = world.getJointList();
                            while (j) {
                                let nextJ = j.getNext();
                                if (j.ropeId === rId) world.destroyJoint(j);
                                j = nextJ;
                            }
                        } else {
                            let j = world.getJointList();
                            while (j) {
                                let nextJ = j.getNext();
                                if (j.getBodyA() === clickedBody || j.getBodyB() === clickedBody) world.destroyJoint(j);
                                j = nextJ;
                            }
                            world.destroyBody(clickedBody);

                    }
                } else if (currentMode === "bar" || currentMode === "rope" || currentMode === "chain") {
                    if (clickedBody) {
                        const localPoint = clickedBody.getLocalPoint(mousePos);
                        if (!linkStartBody) {
                            linkStartBody = clickedBody;
                            linkStartPoint = localPoint;
                        } else {
                            // Se clicchiamo esattamente sullo stesso punto iniziale, annulliamo la selezione del punto
                            if (
                                linkStartBody === clickedBody &&
                                planck.Vec2.distance(

                                    clickedBody.getWorldPoint(localPoint)
                                ) < 10
                            ) {
                                linkStartBody = null;
                                linkStartPoint = null;
                                return;
                            }

                            const posA = linkStartBody.getWorldPoint(linkStartPoint);
                            const posB = clickedBody.getWorldPoint(localPoint);

                                const joint = world.createJoint(

                                        bodyA: linkStartBody,
                                        bodyB: clickedBody,
                                        localAnchorA: linkStartPoint,
                                        localAnchorB: localPoint,

                                        frequencyHz: 0,
                                        dampingRatio: 0.1
                                    })

                                joint.isCustomRender = true;

                                const angle = Math.atan2(posB.y - posA.y, posB.x - posA.x);

                                for (let i = 1; i < numSegments; i++) {
                                    const percent = i / numSegments;
                                    const x = posA.x + (posB.x - posA.x) * percent;
                                    const y = posA.y + (posB.y - posA.y) * percent;
                                    const segBody = world.createDynamicBody({
                                        position: planck.Vec2(x, y),
                                        angle: angle

                                    segBody.createFixture(planck.Box(segmentLength * 0.45, 7, planck.Vec2(0, 0), 0), {
                                        density: 0.1,

                                    });

                                    const revJoint = world.createJoint(
                                        planck.RevoluteJoint({
                                            bodyA: prevBody,

                                            localAnchorA:
                                                prevBody === linkStartBody
                                                    ? prevAnchor
                                                    : planck.Vec2(segmentLength * 0.45, 0),
                                            localAnchorB: planck.Vec2(-segmentLength * 0.45, 0),
                                            enableLimit: true,
                                            lowerAngle: -0.25,
                                            upperAngle: 0.25
                                        })

                                    revJoint.ropeId = currentRopeId;
                                    revJoint.isCustomRender = true;
                                    revJoint.renderColor = "#a4b0be";
                                    revJoint.renderWidth = 3;

                                    prevBody = segBody;
                                    prevAnchor = planck.Vec2(segmentLength * 0.45, 0);
                                }
                                const finalJoint = world.createJoint(
                                    planck.RevoluteJoint({
                                        bodyA: prevBody,
                                        bodyB: clickedBody,
                                        localAnchorA: prevAnchor,
                                        localAnchorB: localPoint,
                                        enableLimit: true,
                                        lowerAngle: -0.25,
                                        upperAngle: 0.25
                                    })

                                finalJoint.ropeId = currentRopeId;

                            } else {
                                ropeIdCounter++;
                                const currentRopeId = ropeIdCounter;
                                const numSegments = parseInt(document.getElementById("slider-rope-seg").value);
                                const ropeStiffness = parseFloat(document.getElementById("slider-rope-stiff").value);
                                const totalDist = planck.Vec2.distance(posA, posB);
                                const segmentLength = totalDist / numSegments;
                                let prevBody = linkStartBody;
                                let prevAnchor = linkStartPoint;

                                for (let i = 1; i < numSegments; i++) {
                                    const percent = i / numSegments;
                                    const x = posA.x + (posB.x - posA.x) * percent;
                                    const y = posA.y + (posB.y - posA.y) * percent;
                                    const segBody = world.createDynamicBody({ position: planck.Vec2(x, y) });
                                    segBody.createFixture(planck.Circle(2.0), {

                                    joint.ropeId = currentRopeId;

                                const finalJoint = world.createJoint(
                                    planck.DistanceJoint({
                                        bodyA: prevBody,
                                        bodyB: clickedBody,

                                        localAnchorB: localPoint,
                                        length: segmentLength,
                                        frequencyHz: ropeStiffness * 15,

                                    })
                                );
                                finalJoint.ropeId = currentRopeId;
                                finalJoint.isRopeDistanceJoint = true;
                                finalJoint.isCustomRender = true;
                                finalJoint.renderColor = "#ff4757";
                                finalJoint.renderWidth = 2;
                            }
                            linkStartBody = null;
                            linkStartPoint = null;
                        }
                    }
                }

            function distToSegment(p, p1, p2) {
                const l2 = (p2.x - p1.x) * (p2.x - p1.x) + (p2.y - p1.y) * (p2.y - p1.y);
                if (l2 === 0) return Math.hypot(p.x - p1.x, p.y - p1.y);
                let t = ((p.x - p1.x) * (p2.x - p1.x) + (p.y - p1.y) * (p2.y - p1.y)) / l2;
                t = Math.max(0, Math.min(1, t));
                return Math.hypot(p.x - (p1.x + t * (p2.x - p1.x)), p.y - (p1.y + t * (p2.y - p1.y)));
            }

                for (let i = 0; i < sides; i++) {

                    vertices.push(planck.Vec2(radius * Math.cos(angle), radius * Math.sin(angle)));
                }
                return vertices;
            }

            function spawnElement(x, y, typeKey) {
                const cfg = blockConfigs[typeKey];

                let body = cfg.isStatic

                    });

                        friction: 0.2
                    });

                    body.createFixture(planck.Box(cfg.size, cfg.size), {
                        density: cfg.density,
                        restitution: cfg.restitution,
                        friction: 0.2
                    });

                    const verts = getPolygonVertices(cfg.size, cfg.sides);
                    body.createFixture(planck.Polygon(verts), {

            function triggerDecay() {

                    b.setAngularVelocity((Math.random() - 0.5) * 10);

                if (audioCtx.state === "suspended") audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(baseRoot * PHI, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(baseRoot * PHI * 2, audioCtx.currentTime + 0.6);
                gain.gain.setValueAtTime(0.25 * masterVolume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.8);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(1.8);
            }

            // --- FRACTAL TREES INTEGRATION ---
            let backgroundTrees = [];
            let maxDepth = 6;
            let baseSpread = 0.45;

            function seededRandom(s) {
                let seed = s;
                return function () {
                    seed = (seed * 16807) % 2147483647;
                    return (seed - 1) / 2147483646;
                };
            }

            function createFractalTree(worldX, groundY, scale, seedVal) {
                const trunkLen = 110 * scale;
                const tree = {
                    worldX,
                    groundY,
                    scale,
                    trunkLen,
                    branchCount: 0,
                    bX1: null,
                    bY1: null,
                    bLength: null,
                    bAngle: null,
                    bDepthArr: null,
                    bDepthRatio: null,
                    bParent: null,
                    bRandFactor: null,
                    bThickness: null,
                    bIsTerminal: null,
                    pX1: null,
                    pY1: null,
                    pX2: null,
                    pY2: null,
                    pGrow: null,
                    pValid: null
                };

                let rand = seededRandom(seedVal);
                const tmp = [];

                function recurse(x, y, angle, length, depth, parentIndex) {
                    if (depth > maxDepth || length < 6 * scale) return;
                    const endX = x + Math.sin(angle) * length;
                    const endY = y - Math.cos(angle) * length;
                    const idx = tmp.length / 9;
                    const dr = depth / maxDepth;
                    const randAngle = (rand() - 0.5) * 0.3;
                    const randLen = 0.58 + rand() * 0.12;
                    const rf = rand();

                    tmp.push(
                        x,
                        y,
                        length,
                        angle,
                        depth,
                        dr,
                        parentIndex,
                        rf,
                        Math.max(0.5, (maxDepth - depth) * 1.1 * scale + 0.4)
                    );

                    const spread = baseSpread * (0.8 + rand() * 0.4);
                    const nextLen = length * randLen;
                    recurse(endX, endY, angle - spread + randAngle, nextLen, depth + 1, idx);
                    recurse(endX, endY, angle + spread + randAngle, nextLen, depth + 1, idx);
                }

                recurse(worldX, groundY, 0, trunkLen, 0, -1);

                const n = tmp.length / 9;
                tree.branchCount = n;
                tree.bX1 = new Float64Array(n);
                tree.bY1 = new Float64Array(n);
                tree.bLength = new Float64Array(n);
                tree.bAngle = new Float64Array(n);
                tree.bDepthArr = new Uint16Array(n);
                tree.bDepthRatio = new Float32Array(n);
                tree.bParent = new Int32Array(n);
                tree.bRandFactor = new Float32Array(n);
                tree.bThickness = new Float32Array(n);
                tree.bIsTerminal = new Uint8Array(n);
                tree.pX1 = new Float64Array(n);
                tree.pY1 = new Float64Array(n);
                tree.pX2 = new Float64Array(n);
                tree.pY2 = new Float64Array(n);
                tree.pValid = new Uint8Array(n);

                for (let i = 0; i < n; i++) {
                    const o = i * 9;
                    tree.bX1[i] = tmp[o];
                    tree.bY1[i] = tmp[o + 1];
                    tree.bLength[i] = tmp[o + 2];
                    tree.bAngle[i] = tmp[o + 3];
                    tree.bDepthArr[i] = tmp[o + 4];
                    tree.bDepthRatio[i] = tmp[o + 5];
                    tree.bParent[i] = tmp[o + 6];
                    tree.bRandFactor[i] = tmp[o + 7];
                    tree.bThickness[i] = tmp[o + 8];
                }

                const hasChild = new Uint8Array(n);
                for (let i = 0; i < n; i++) {
                    const pi = tree.bParent[i];
                    if (pi >= 0) hasChild[pi] = 1;
                }
                for (let i = 0; i < n; i++) {
                    if (!hasChild[i]) tree.bIsTerminal[i] = 1;
                }
                return tree;
            }

            function updateTreesCount() {
                const countInput = parseInt(document.getElementById("input-trees-count").value) || 12;
                document.getElementById("val-trees-count").innerText = countInput;
                initCustomBackgroundTrees(countInput);
            }

            function initCustomBackgroundTrees(count) {
                backgroundTrees = [];
                const w = window.innerWidth;
                const h = window.innerHeight;
                for (let i = 0; i < count; i++) {
                    const posX = w * ((i + 0.5) / count) + (Math.random() - 0.5) * 40;
                    const scaleVal = 0.5 + Math.random() * 0.7;
                    const seedVal = 100 + i * 37;
                    const groundY = h * (0.68 + Math.random() * 0.08);
                    backgroundTrees.push(createFractalTree(posX, groundY, scaleVal, seedVal));
                }
            }

            function initBackgroundTrees() {
                const countInput = parseInt(document.getElementById("input-trees-count")?.value) || 12;
                initCustomBackgroundTrees(countInput);
            }
            initBackgroundTrees();

            let fallingLeaves = [];
            for (let i = 0; i < 90; i++) {
                fallingLeaves.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    size: Math.random() * 7 + 3,
                    speedY: Math.random() * 0.9 + 0.4,
                    angle: Math.random() * Math.PI * 2,
                    spin: (Math.random() - 0.5) * 0.03
                });
            }

            function drawJapaneseBackground() {
                const isLight = document.body.classList.contains("light-theme");
                bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);

                const w = bgCanvas.width;
                const h = bgCanvas.height;

                let skyGrad = bgCtx.createLinearGradient(0, 0, 0, h);
                if (isLight) {
                    skyGrad.addColorStop(0, "#ffd1dc");
                    skyGrad.addColorStop(0.5, "#e0f2fe");
                    skyGrad.addColorStop(1, "#f1f5f9");
                } else {
                    skyGrad.addColorStop(0, "#1e1b4b");
                    skyGrad.addColorStop(0.5, "#311030");
                    skyGrad.addColorStop(1, "#0f172a");
                }
                bgCtx.fillStyle = skyGrad;
                bgCtx.fillRect(0, 0, w, h);

                bgCtx.fillStyle = isLight ? "rgba(251, 191, 36, 0.3)" : "rgba(244, 114, 182, 0.15)";
                bgCtx.beginPath();
                bgCtx.arc(w * 0.8, h * 0.25, 70, 0, Math.PI * 2);
                bgCtx.fill();

                bgCtx.fillStyle = isLight ? "rgba(148, 163, 184, 0.4)" : "rgba(30, 41, 59, 0.6)";
                bgCtx.beginPath();
                bgCtx.moveTo(0, h * 0.65);
                bgCtx.lineTo(w * 0.2, h * 0.45);
                bgCtx.lineTo(w * 0.5, h * 0.6);
                bgCtx.lineTo(w * 0.75, h * 0.4);
                bgCtx.lineTo(w, h * 0.55);
                bgCtx.lineTo(w, h);
                bgCtx.lineTo(0, h);
                bgCtx.closePath();
                bgCtx.fill();

                bgCtx.fillStyle = isLight ? "rgba(100, 116, 139, 0.6)" : "rgba(15, 23, 42, 0.85)";
                bgCtx.beginPath();
                bgCtx.moveTo(0, h * 0.75);
                bgCtx.lineTo(w * 0.35, h * 0.55);
                bgCtx.lineTo(w * 0.6, h * 0.68);
                bgCtx.lineTo(w * 0.85, h * 0.52);
                bgCtx.lineTo(w, h * 0.62);
                bgCtx.lineTo(w, h);
                bgCtx.lineTo(0, h);
                bgCtx.closePath();
                bgCtx.fill();

                function drawPagoda(pX, pY) {
                    bgCtx.fillStyle = isLight ? "#475569" : "#090d16";
                    bgCtx.fillRect(pX - 16, pY - 25, 32, 25);
                    bgCtx.beginPath();
                    bgCtx.moveTo(pX - 35, pY);
                    bgCtx.lineTo(pX + 35, pY);
                    bgCtx.lineTo(pX + 25, pY - 12);
                    bgCtx.lineTo(pX - 25, pY - 12);
                    bgCtx.closePath();
                    bgCtx.fill();
                    bgCtx.fillRect(pX - 12, pY - 37, 24, 12);
                    bgCtx.beginPath();
                    bgCtx.moveTo(pX - 25, pY - 25);
                    bgCtx.lineTo(pX + 25, pY - 25);
                    bgCtx.lineTo(pX + 18, pY - 35);
                    bgCtx.lineTo(pX - 18, pY - 35);
                    bgCtx.closePath();
                    bgCtx.fill();
                    bgCtx.beginPath();
                    bgCtx.moveTo(pX - 16, pY - 45);
                    bgCtx.lineTo(pX + 16, pY - 45);
                    bgCtx.lineTo(pX + 10, pY - 52);
                    bgCtx.lineTo(pX - 10, pY - 52);
                    bgCtx.closePath();
                    bgCtx.fill();
                    bgCtx.fillRect(pX - 1.5, pY - 64, 3, 12);
                }
                drawPagoda(w * 0.72, h * 0.57);
                drawPagoda(w * 0.38, h * 0.61);

                const time = Date.now() * 0.003;
                const effectiveWind = windSpeed + Math.sin(time) * windTurbulence;

                backgroundTrees.forEach((t) => {
                    const n = t.branchCount;
                    const gw = effectiveWind * 0.1;

                    for (let i = 0; i < n; i++) {
                        const pi = t.bParent[i];
                        let x1, y1;
                        if (pi === -1) {
                            x1 = t.bX1[i];
                            y1 = t.bY1[i];
                        } else {
                            if (!t.pValid[pi]) {
                                t.pValid[i] = 0;
                                continue;
                            }
                            x1 = t.pX2[pi];
                            y1 = t.pY2[pi];
                        }

                        const dr = t.bDepthRatio ? t.bDepthRatio[i] : t.bDepthArr[i] / maxDepth;
                        const rf = t.bRandFactor[i];
                        const d = t.bDepthArr[i];
                        const wind = gw * (0.2 + dr * 0.8) + Math.sin(time * 0.003 + rf * 20 + d) * 0.08 * dr;
                        const a = t.bAngle[i] + wind;
                        const len = t.bLength[i];

                        t.pX1[i] = x1;
                        t.pY1[i] = y1;
                        t.pX2[i] = x1 + Math.sin(a) * len;
                        t.pY2[i] = y1 - Math.cos(a) * len;
                        t.pValid[i] = 1;
                    }

                    bgCtx.lineCap = "round";
                    let prevW = -1,
                        pathStarted = false;
                    for (let i = 0; i < n; i++) {
                        if (!t.pValid[i]) continue;
                        const wthick = (t.bThickness[i] + 0.5) | 0;
                        if (wthick !== prevW) {
                            if (pathStarted) bgCtx.stroke();
                            bgCtx.beginPath();
                            bgCtx.lineWidth = wthick;
                            bgCtx.strokeStyle = isLight
                                ? t.scale < 0.8
                                    ? "#94a3b8"
                                    : "#334155"
                                : t.scale < 0.8
                                  ? "#1e293b"
                                  : "#0f172a";
                            prevW = wthick;
                            pathStarted = true;
                        }
                        bgCtx.moveTo(t.pX1[i], t.pY1[i]);
                        bgCtx.lineTo(t.pX2[i], t.pY2[i]);
                    }
                    if (pathStarted) bgCtx.stroke();

                    bgCtx.fillStyle = isLight ? "rgba(244, 114, 182, 0.85)" : "rgba(244, 114, 182, 0.7)";
                    bgCtx.beginPath();
                    const dotR = Math.max(2.5, 5 * t.scale);
                    for (let i = 0; i < n; i++) {
                        if (!t.bIsTerminal[i] || !t.pValid[i]) continue;
                        bgCtx.moveTo(t.pX2[i] + dotR, t.pY2[i]);
                        bgCtx.arc(t.pX2[i], t.pY2[i], dotR, 0, Math.PI * 2);
                        bgCtx.moveTo(t.pX2[i] + dotR * 0.6, t.pY2[i] - dotR * 0.5);
                        bgCtx.arc(t.pX2[i] + dotR * 0.4, t.pY2[i] - dotR * 0.4, dotR * 0.7, 0, Math.PI * 2);
                    }
                    bgCtx.fill();
                });

                bgCtx.fillStyle = isLight ? "#ec4899" : "#f472b6";
                fallingLeaves.forEach((leaf) => {
                    leaf.x += effectiveWind * 1.5 + Math.sin(leaf.angle) * 0.8;
                    leaf.y += leaf.speedY + Math.abs(effectiveWind) * 0.1;
                    leaf.angle += leaf.spin;

                    if (leaf.x > w + 20) leaf.x = -20;
                    if (leaf.x < -20) leaf.x = w + 20;
                    if (leaf.y > h + 20) {
                        leaf.y = -20;
                        leaf.x = Math.random() * w;
                    }

                    bgCtx.save();
                    bgCtx.translate(leaf.x, leaf.y);
                    bgCtx.rotate(leaf.angle);
                    bgCtx.beginPath();
                    bgCtx.ellipse(0, 0, leaf.size, leaf.size * 0.5, 0, 0, Math.PI * 2);
                    bgCtx.fill();
                    bgCtx.restore();
                });
            }

            function gameLoop() {
                if (!isPaused) {
                    if (windSpeed !== 0 || windTurbulence > 0) {
                        const time = Date.now() * 0.003;
                        for (let b = world.getBodyList(); b; b = b.getNext()) {
                            if (!b.isStatic() && !b.isWall) {
                                const noise =
                                    (Math.sin(time + b.getPosition().x * 0.05) * 0.5 + Math.cos(time * 0.7) * 0.5) *
                                    windTurbulence;
                                const totalWindForce = (windSpeed + noise) * 300;
                                b.applyForceToCenter(planck.Vec2(totalWindForce, 0), true);
                            }
                        }
                    }
                    world.step(timeStep, velIterations, posIterations);
                }

                drawJapaneseBackground();

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const isLight = document.body.classList.contains("light-theme");
                const wallColor = isLight ? "#d1d5db" : "#1a1a2e";

                for (let b = world.getBodyList(); b; b = b.getNext()) {
                    const pos = b.getPosition();
                    const angle = b.getAngle();

                    ctx.save();
                    ctx.translate(pos.x, pos.y);
                    ctx.rotate(angle);

                    for (let f = b.getFixtureList(); f; f = f.getNext()) {
                        const shape = f.getType();
                        ctx.fillStyle = b.isWall ? wallColor : b.renderColor || "#fff";
                        ctx.strokeStyle = "#000";
                        ctx.lineWidth = 1.5;

                        if (shape === "circle") {
                            const radius = f.getShape().m_radius;
                            ctx.beginPath();
                            ctx.arc(0, 0, radius, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.stroke();
                        } else if (shape === "polygon") {
                            const vertices = f.getShape().m_vertices;
                            ctx.beginPath();
                            for (let i = 0; i < vertices.length; i++) {
                                const v = vertices[i];
                                if (i === 0) ctx.moveTo(v.x, v.y);
                                else ctx.lineTo(v.x, v.y);
                            }
                            ctx.closePath();
                            ctx.fill();
                            ctx.stroke();
                        }
                    }
                    ctx.restore();
                }

                for (let j = world.getJointList(); j; j = j.getNext()) {
                    if (typeof j.getAnchorA === "function" && typeof j.getAnchorB === "function") {
                        const anchorA = j.getAnchorA();
                        const anchorB = j.getAnchorB();
                        if (anchorA && anchorB) {
                            ctx.save();
                            ctx.strokeStyle = j.renderColor || (isLight ? "#6b7280" : "#a4b0be");
                            ctx.lineWidth = j.renderWidth || 2;
                            ctx.beginPath();
                            ctx.moveTo(anchorA.x, anchorA.y);
                            ctx.lineTo(anchorB.x, anchorB.y);
                            ctx.stroke();
                            ctx.restore();
                        }
                    }
                }

                // --- GESTIONE E DISEGNO DEL CERCHIETTO DI ANCORAGGIO ---
                if (linkStartBody && (currentMode === "rope" || currentMode === "chain" || currentMode === "bar")) {
                    const startWorldPoint = linkStartBody.getWorldPoint(linkStartPoint);
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(startWorldPoint.x, startWorldPoint.y, 8, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(255, 0, 85, 0.4)";
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = "#ff0055";
                    ctx.stroke();
                    ctx.restore();
                }

                requestAnimationFrame(gameLoop);
            }

            resizeCanvas();
            requestAnimationFrame(gameLoop);
        </script>
    </body>
</html>
